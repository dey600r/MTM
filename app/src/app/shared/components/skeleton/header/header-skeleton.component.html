<ion-toolbar>
  <ion-title style="padding-left: 20%; padding-right: 20%;">
    <ion-skeleton-text animated></ion-skeleton-text>
  </ion-title>
</ion-toolbar>
<ion-grid class="skeleton-background segment-button-fixed">
  <ion-row>
    @for (col of input; track col; let i = $index) {
      <ion-col [size]="col" style="text-align: center;">
        @if (i % 2 === 0) {
          <ion-spinner name="lines-small" color="medium"></ion-spinner>
        }
        @if (i % 2 !== 0) {
          <ion-skeleton-text animated
          [ngClass]="{ 'skeleton-width-par': input.length > 2, 'skeleton-width-one': input.length <= 2}"></ion-skeleton-text>
        }
      </ion-col>
    }
  </ion-row>
</ion-grid>
